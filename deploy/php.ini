; Production PHP settings for PhytoQuest.
expose_php = Off
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Code only changes on redeploy, which recreates the containers.
opcache.validate_timestamps = 0
